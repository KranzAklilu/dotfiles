[general]
import = [
"~/.config/alacritty/theme.toml"
]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[font]
size = 12.0

[font.normal]
family = "Cascadia Code NF"
style = "Regular"


[font.bold]
family = "Cascadia Code NF"
style = "Bold"

[font.italic]
family = "Cascadia Code NF"
style = "Italic"
